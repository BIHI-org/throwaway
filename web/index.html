<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#18203A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bismillah">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="platform.js"></script>
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;600;700;800&display=swap">
<style>
/* Layout: one-screen app — top bar (navy) with big tabs; content fills the rest. Order screen = menu left, ticket right. Chef red is the one bold color. */
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --line:#DCDFE8; --ink:#18203A; --muted:#646C82;
  --bar:#18203A; --bar-ink:#FFFFFF; --bar-muted:#A9B0C6; --bar-soft:#262F4D;
  --accent:#D63E2A; --accent-ink:#FFFFFF; --accent-soft:#FBE6E2;
  --cook:#D98810; --cook-soft:#FCF0DB; --ready:#0E8576; --ready-soft:#DDF3EF;
  --danger:#B42318; --danger-soft:#FBE4E1; --open:#3B5BDB; --open-soft:#E5EAFC;
  --c0:#D63E2A; --c1:#3B5BDB; --c2:#0E8576; --c3:#C77700; --c4:#8B3FB8; --c5:#C2185B; --c6:#2F7D32; --c7:#5D6B82;
  --display:"Bricolage Grotesque","Noto Sans Arabic",ui-rounded,system-ui,sans-serif;
  --body:"Figtree","Noto Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10131D; --surface:#1A1F2E; --line:#2B3246; --ink:#ECEEF5; --muted:#99A0B6;
  --bar:#0B0E16; --bar-ink:#ECEEF5; --bar-muted:#8D94AA; --bar-soft:#1F2536;
  --accent:#F2614C; --accent-ink:#1A0B08; --accent-soft:#3A1C18;
  --cook:#F0A73A; --cook-soft:#38290F; --ready:#3CC4B0; --ready-soft:#123430;
  --danger:#F07A6A; --danger-soft:#3A1C18; --open:#7C95F0; --open-soft:#1E2747;
  --c0:#F2614C; --c1:#7C95F0; --c2:#3CC4B0; --c3:#F0A73A; --c4:#B983E0; --c5:#EC6A9C; --c6:#6CC070; --c7:#9AA6BC; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10131D; --surface:#1A1F2E; --line:#2B3246; --ink:#ECEEF5; --muted:#99A0B6;
  --bar:#0B0E16; --bar-ink:#ECEEF5; --bar-muted:#8D94AA; --bar-soft:#1F2536;
  --accent:#F2614C; --accent-ink:#1A0B08; --accent-soft:#3A1C18;
  --cook:#F0A73A; --cook-soft:#38290F; --ready:#3CC4B0; --ready-soft:#123430;
  --danger:#F07A6A; --danger-soft:#3A1C18; --open:#7C95F0; --open-soft:#1E2747;
  --c0:#F2614C; --c1:#7C95F0; --c2:#3CC4B0; --c3:#F0A73A; --c4:#B983E0; --c5:#EC6A9C; --c6:#6CC070; --c7:#9AA6BC; color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;display:flex;flex-direction:column;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Top bar */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--bar);color:var(--bar-ink);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.01em;margin-right:auto}
.brand .hat{width:36px;height:36px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:#fff}
.brand .hat svg{width:24px;height:24px}
.tabs{display:flex;gap:4px;background:var(--bar-soft);padding:4px;border-radius:14px}
.tab{padding:10px 18px;border-radius:10px;font-weight:700;display:flex;align-items:center;gap:8px;color:var(--bar-muted)}
.tab[aria-selected="true"]{background:var(--accent);color:#fff}
.badge{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--cook);color:#fff;font-size:12px;display:inline-grid;place-items:center}
.waiter{display:flex;align-items:center;gap:8px;font-weight:600}
.waiter span{color:var(--bar-muted)}
.waiter select{font:inherit;padding:9px 10px;border-radius:10px;border:1px solid transparent;background:var(--bar-soft);color:var(--bar-ink)}
.gear{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;color:var(--bar-muted)}
.gear:hover,.gear[aria-current="true"]{background:var(--bar-soft);color:var(--bar-ink)}

main{flex:1;min-height:0;overflow:auto;padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h2{font-family:var(--display);font-weight:800;font-size:24px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.sub{color:var(--muted)}
.spacer{flex:1}

/* Tables */
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%}
.floor{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tbl{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px;min-height:120px;text-align:start;display:flex;flex-direction:column;gap:6px;transition:transform .12s}
.tbl:hover{transform:translateY(-2px)}
.tbl .n{font-family:var(--display);font-weight:800;font-size:30px;line-height:1}
.tbl .st{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.tbl .meta{margin-top:auto;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:6px}
.tbl.free .st{color:var(--muted)}
.tbl.open{border-color:var(--open);background:var(--open-soft)} .tbl.open .st{color:var(--open)}
.tbl.cook{border-color:var(--cook);background:var(--cook-soft)} .tbl.cook .st{color:var(--cook)}
.tbl.ready{border-color:var(--ready);background:var(--ready-soft)} .tbl.ready .st{color:var(--ready)}
.tbl.new{border-style:dashed;align-items:center;justify-content:center;color:var(--accent);font-weight:700}
.tbl.new .n{color:var(--accent)}
.section{font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--muted);margin:24px 0 10px}
.togo{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;background:var(--accent);color:#fff;border-radius:6px;padding:2px 7px;vertical-align:middle}

/* Order screen */
.order{display:grid;grid-template-columns:1fr 370px;gap:16px;height:100%}
.menu{min-width:0;display:flex;flex-direction:column;gap:12px;min-height:0}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.cat{padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;white-space:nowrap}
.cat[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;overflow:auto;align-content:start}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:start;min-height:86px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;position:relative}
.item:hover:not(:disabled){border-color:var(--accent)}
.item:active:not(:disabled){transform:scale(.97)}
.item b{font-weight:700;line-height:1.25}
.item .p{color:var(--muted);font-weight:600}
.item:disabled{opacity:.5;cursor:not-allowed}
.item .so{position:absolute;top:10px;right:10px;font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--danger);background:var(--danger-soft);padding:2px 6px;border-radius:5px}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ticket header{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ticket header .t{font-family:var(--display);font-weight:800;font-size:21px;margin-right:auto}
.back,.small{font-weight:600;color:var(--muted);padding:6px 8px;border-radius:8px}
.back:hover,.small:hover{background:var(--bg)}
.small{border:1px solid var(--line);font-size:13px}
.lines{flex:1;overflow:auto;padding:6px 0}
.line{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px dashed var(--line)}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:30px;height:30px;border-radius:8px;background:var(--bg);font-weight:700;font-size:16px}
.qty span{min-width:20px;text-align:center;font-weight:700}
.line .nm{min-width:0}
.line .nm small{display:block;color:var(--muted);font-size:12px}
.sent-tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--cook)}
.notebtn{color:var(--accent);font-weight:600;font-size:12px;padding:0}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.tot{padding:12px 14px;border-top:1px solid var(--line);display:grid;gap:4px}
.tot div{display:flex;justify-content:space-between}
.tot .big{font-family:var(--display);font-weight:800;font-size:24px;margin-top:4px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 14px 14px}
.btn{padding:14px;border-radius:12px;font-weight:700;font-size:16px;text-align:center}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--bg);border:1px solid var(--line)}
.btn.cook{background:var(--cook);color:#fff}
.btn.ok{background:var(--ready);color:#fff}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.full{grid-column:1/-1}

/* Kitchen */
.kitchen{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;align-items:start}
.kt{background:var(--surface);border:2px solid var(--cook);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.kt.done{border-color:var(--ready)}
.kt header{background:var(--cook-soft);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.kt.done header{background:var(--ready-soft)}
.kt header b{font-family:var(--display);font-size:21px;font-weight:800}
.kt header .tm{font-weight:800;font-size:20px;font-family:var(--display);font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:6px}
.kt header .tm small{font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;opacity:.75}
.kt.done.stale{border-color:var(--danger);animation:redpulse 1.4s ease-in-out infinite}
.kt.done.stale header{background:var(--danger-soft)}
.kt.done.stale .tm{color:var(--danger)}
@keyframes redpulse{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 6px var(--danger-soft)}}
.kt header .tm.late{color:var(--danger)}
.kt ul{list-style:none;margin:0;padding:10px 14px;display:grid;gap:8px}
.kt li{display:flex;gap:10px;font-size:17px;font-weight:600}
.kt li .q{min-width:28px;color:var(--cook)}
.kt li small{display:block;font-weight:600;color:var(--danger);font-size:13px}
.kt .by{padding:0 14px 8px;color:var(--muted);font-size:13px}
.kt .btn{margin:0 14px 14px}

/* Modal */
.scrim{position:fixed;inset:0;background:rgba(8,11,20,.5);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--surface);border-radius:20px;width:min(460px,100%);max-height:100%;overflow:auto;padding:20px;display:grid;gap:14px}
.modal h3{font-family:var(--display);font-weight:800;font-size:22px;margin:0}
.rcpt{background:var(--bg);border-radius:12px;padding:14px;font-size:14px;display:grid;gap:4px}
.rcpt div{display:flex;justify-content:space-between;gap:10px}
.rcpt hr{border:0;border-top:1px dashed var(--line);width:100%;margin:6px 0}
.lbl2{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.chips button{padding:10px;border-radius:10px;border:1px solid var(--line);font-weight:600}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips button:disabled{opacity:.35;cursor:not-allowed}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);font-weight:700;font-size:18px}
.stepper b{min-width:24px;text-align:center;font-size:18px}
.split{background:var(--open-soft);color:var(--open);border-radius:10px;padding:10px 12px;font-weight:700;display:flex;justify-content:space-between}
label.fld{display:grid;gap:4px;font-weight:600;font-size:13px;color:var(--muted)}
input,select{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:0}

/* Settings */
.set{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px;min-width:0}
.card h3{margin:0;font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.row > *{flex:1;min-width:90px}
.list{display:grid;gap:6px;max-height:360px;overflow:auto}
.li{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg);border-radius:10px}
.li span{flex:1;min-width:0}
.li .x{color:var(--danger);font-weight:700;padding:4px 8px;border-radius:6px}
.li .soT{font-size:12px;font-weight:700;padding:5px 8px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.li .soT[aria-pressed="true"]{background:var(--danger-soft);color:var(--danger);border-color:var(--danger)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--bg);border-radius:12px;padding:12px}
.kpi span{display:block;color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.kpi b{font-family:var(--display);font-size:24px;font-weight:800}
.kpi.hero{grid-column:1/-1;background:var(--accent);color:var(--accent-ink)}
.kpi.hero span{color:inherit;opacity:.85}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;font-size:14px}
.bar i{display:block;height:10px;border-radius:5px;background:var(--accent)}
.bar .tr{background:var(--bg);border-radius:5px;overflow:hidden}
.bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.live{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--bar-muted);padding:6px 10px;border-radius:999px;background:var(--bar-soft)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--bar-muted)}
.live.on i{background:#3CC48A;box-shadow:0 0 0 3px rgba(60,196,138,.25)}
.live.warn i{background:var(--cook)}
.paper{background:#FFFFFF;color:#1B1B1B;border-radius:6px;padding:18px 16px;font-size:14px;display:grid;gap:3px;box-shadow:0 1px 0 var(--line),0 6px 18px rgba(0,0,0,.08);font-variant-numeric:tabular-nums}
.paper .c{text-align:center}
.paper .big{font-family:var(--display);font-weight:800;font-size:20px}
.paper .r{display:flex;justify-content:space-between;gap:10px}
.paper .r.b{font-weight:800;font-size:17px}
.paper hr{border:0;border-top:1px dashed #B9B9B9;width:100%;margin:6px 0}
.paper .m{color:#666;font-size:12px}
.paidmark{display:flex;align-items:center;gap:10px;color:var(--ready);font-weight:800;font-size:18px}
.paidmark i{width:28px;height:28px;border-radius:50%;background:var(--ready);color:#fff;display:grid;place-items:center;font-style:normal;font-size:16px}
.acts3{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button.li{width:100%;text-align:start;cursor:pointer}
button.li:hover{outline:1px solid var(--accent)}
.board{display:flex;gap:12px;overflow-x:auto;align-items:flex-start;padding-bottom:12px}
.col{flex:0 0 270px;background:var(--surface);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;max-height:100%;min-width:0}
.col header{display:flex;align-items:center;gap:6px;padding:10px 10px 8px;border-bottom:3px solid var(--accent)}
.col header input{flex:1;font-family:var(--display);font-weight:800;font-size:17px;border-color:transparent;background:transparent;padding:6px 8px}
.col header input:hover,.col header input:focus{border-color:var(--line);background:var(--bg)}
.col .cnt{font-size:12px;font-weight:700;color:var(--muted);background:var(--bg);border-radius:999px;padding:3px 8px}
.col .its{display:grid;gap:6px;padding:8px;overflow:auto}
.mi{display:grid;grid-template-columns:1fr 74px;gap:6px;background:var(--bg);border-radius:10px;padding:8px}
.mi.out{opacity:.6}
.mi input{padding:7px 8px;font-size:14px;background:var(--surface)}
.mi .ops{grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mi .ops .soT{font-size:12px;font-weight:700;padding:5px 8px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.mi .ops .soT[aria-pressed="true"]{background:var(--danger-soft);color:var(--danger);border-color:var(--danger)}
.mi .ops .x{margin-left:auto;color:var(--danger);font-weight:700;padding:4px 8px;border-radius:6px;font-size:13px}
.col .add{display:grid;grid-template-columns:1fr 74px;gap:6px;padding:8px;border-top:1px dashed var(--line)}
.col .add input{padding:8px;font-size:14px}
.col .add .btn{grid-column:1/-1;padding:10px;font-size:14px}
.col.newcol{border-style:dashed;padding:12px;gap:8px}
@media (max-width:480px){.col{flex-basis:85vw}}
.cat{display:flex;align-items:center;gap:8px}
.cat::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--cc,var(--muted))}
.cat[aria-pressed="true"]{background:var(--cc);border-color:var(--cc);color:#fff}
.cat[aria-pressed="true"]::before{background:#fff}
.item{border-top:4px solid var(--cc,var(--line))}
.item .ic{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--cc)}
.item .sd{font-size:11px;font-weight:700;color:var(--ready)}
.msearch{display:flex;gap:8px}
.msearch input{flex:1;padding:12px 14px;font-size:15px;border-radius:12px}
.guests{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);font-size:14px}
.guests button{width:30px;height:30px;border-radius:8px;background:var(--bg);font-weight:700;font-size:16px}
.guests b{min-width:18px;text-align:center}
.line .with{display:block;color:var(--ready);font-size:12px;font-weight:600}
.again{font-size:11px;font-weight:700;color:var(--accent);border:1px solid var(--line);border-radius:6px;padding:2px 6px;margin-left:4px}
.tbl.ready{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 5px var(--ready-soft)}}
.kt.a1{border-color:var(--cook)} .kt.a2{border-color:var(--danger)} .kt.a2 header{background:var(--danger-soft)}
.kt li{display:block}

<script>
const fmt=n=>'$'+(Math.round(n*100)/100).toFixed(2);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const mins=t=>Math.max(0,Math.floor((Date.now()-t)/60000));
const isTO=k=>String(k).startsWith('T');
const lab=k=>isTO(k)?'Takeout #'+String(k).slice(1):'Table '+k;
const clone=o=>JSON.parse(JSON.stringify(o));
const dayKey=(t=Date.now())=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

/* Starter menu — used only when this device runs without the shared store */
const STARTER={settings:{"name": "Bismillah Restaurant", "tax": 5, "tables": 15},waiters:['Waiter 1','Waiter 2'],cats:["Breakfast", "Main Dishes", "Rice & Pasta", "Hot Drinks", "Juices & Drinks", "Shakes & Desserts"],menu:[["Breakfast", "Anjero/Liver", 18],["Breakfast", "Porridge", 2],["Breakfast", "Malawah", 3],["Breakfast", "Beef Cubes", 10],["Breakfast", "Goat Liver with Anjero", 18],["Breakfast", "Lamb Liver with Malawah", 18],["Breakfast", "Malawah with Honey", 2.15],["Breakfast", "Egg Fry", 5],["Breakfast", "Spanish Omelette", 8],["Breakfast", "Traditional Breakfast Mix", 15],["Main Dishes", "Pasta Saldato", 16],["Main Dishes", "Jabati Saldato", 15],["Main Dishes", "Pasta", 14],["Main Dishes", "Lamb Shoulder", 24],["Main Dishes", "Salad", 8],["Main Dishes", "Steak", 22],["Main Dishes", "Chicken Fried", 18],["Main Dishes", "Chicken KK", 21],["Main Dishes", "Beef KK", 21],["Main Dishes", "Goat Meat", 22],["Main Dishes", "Chicken Steak", 20],["Main Dishes", "Lamb Shank", 24],["Rice & Pasta", "Ugali Fish", 12],["Rice & Pasta", "Fish Curry", 14],["Rice & Pasta", "Ugali Veg", 8],["Rice & Pasta", "Sarren", 10],["Rice & Pasta", "Cambulo Somali", 12],["Rice & Pasta", "Chicken Curry", 16],["Rice & Pasta", "Alfredo Spaghetti with Goat Meat", 21],["Rice & Pasta", "Sport Rice with Meat", 41],["Rice & Pasta", "Federation Mix", 0],["Hot Drinks", "Latte", 3.5],["Hot Drinks", "Macchiato", 3.5],["Hot Drinks", "Cappuccino", 3.5],["Hot Drinks", "Ice Latte", 4.5],["Hot Drinks", "Americano", 3],["Hot Drinks", "Black Coffee", 2.5],["Hot Drinks", "Black Tea", 2.5],["Hot Drinks", "Green Tea", 2.5],["Hot Drinks", "Traditional Tea", 2.5],["Hot Drinks", "Hot Chocolate", 3.5],["Hot Drinks", "Turkish Coffee", 4],["Juices & Drinks", "Mango Juice", 4.5],["Juices & Drinks", "Avocado Juice", 4.5],["Juices & Drinks", "Watermelon Juice", 4.5],["Juices & Drinks", "Orange Juice", 4.5],["Juices & Drinks", "Pawpaw Juice", 4.5],["Juices & Drinks", "Pineapple Juice", 4.5],["Juices & Drinks", "Beetroot Juice", 5],["Juices & Drinks", "Mixed Fruit Juice", 5],["Juices & Drinks", "Banana Smoothie", 4.5],["Juices & Drinks", "Passion Fruit Juice", 5],["Juices & Drinks", "Fresh Lemonade", 3.5],["Juices & Drinks", "Coke", 2.5],["Juices & Drinks", "Fanta", 2.5],["Shakes & Desserts", "Milkshake", 6.5],["Shakes & Desserts", "Strawberry Smoothie", 7.5],["Shakes & Desserts", "Chocolate Shake", 6.5],["Shakes & Desserts", "Banana Split Shake", 7],["Shakes & Desserts", "Mango Lassi", 5.5],["Shakes & Desserts", "Pistachio Shake", 7.5],["Shakes & Desserts", "Date Shake", 6.5],["Shakes & Desserts", "Mixed Berry Smoothie", 7.5],["Shakes & Desserts", "Fruit Salad with Ice Cream", 8],["Shakes & Desserts", "Tropical Fruit Salad", 7.5]].map(([cat,name,price],i)=>({id:'m'+i,cat,name,price,out:false,side:cat==='Mains'}))};

/* State: config (menu, staff, settings), open orders, kitchen tickets, today's sales */
let S={staff:[],log:[],close:null,closes:{},settings:{name:'Bismillah Restaurant',tax:5,tables:12},waiters:[],menu:[],orders:{},tickets:[],sales:[]};
let mode='connecting', db=null, dl=null, cfgLoaded=false;
let view='tables',cur=null,draft=null,curCat=null,confirmKey=null,pay={tip:0,disc:0,method:'Card',split:1};
let myWaiter=lsGet('mrchef-waiter')||'';
const pinHash=p=>{let x=2166136261;for(const ch of 'mrchef:'+p){x^=ch.charCodeAt(0);x=Math.imul(x,16777619)}return 'h'+(x>>>0).toString(36)};
const staffFrom=c=>Array.isArray(c.staff)&&c.staff.length?c.staff:(c.waiters||[]).map((n,i)=>({id:'s'+i+uid(),name:n,role:'waiter',pin:''}));
const isMgrRole=r=>r==='manager'||r==='admin'||r==='owner';
let ownerMode=false,isOwnerAcct=false,ownerSecret=null,ownerPath=null,ownerCb=null,owFails=0,owBlockUntil=0;
const ROLE={waiter:'Waiter',manager:'Manager',admin:'Admin',owner:'Owner'};
const hasMgr=()=>S.staff.some(x=>isMgrRole(x.role)&&x.pin);
const hasAdmin=()=>S.staff.some(x=>x.role==='admin'&&x.pin);
const lockOn=()=>S.staff.some(x=>x.pin);
const meStaff=()=>ownerMode?{id:'owner',name:'Owner',role:'owner',pin:'x'}:S.staff.find(x=>x.name===waiterNow());
let q='',followToday=true,soundOn=lsGet('mrchef-sound')!==false,actx=null,seenT=null;
const catColor=c=>{const i=catList().indexOf(c);return 'var(--c'+((i<0?7:i)%8)+')'};
const sideCat=()=>catList().find(c=>/side/i.test(c));
const sideItems=()=>{const c=sideCat();return c?S.menu.filter(m=>m.cat===c&&!m.out):[]};
const LOCAL='mrchef-local-v3';

/* ---------- writes: one at a time per document, bursts coalesced ---------- */
const queue={},busy={};
function put(path,data){
  if(mode!=='live'){saveLocal();return}
  queue[path]=data===null?null:clone(data);
  if(!busy[path])flush(path);
}
async function flush(path){
  busy[path]=true;
  while(path in queue){
    const d=queue[path];delete queue[path];
    try{ if(d===null) await db.doc(path).delete(); else await db.doc(path).set(d); }
    catch(e){writeError(e)}
  }
  busy[path]=false;
}
let warned=0;
function writeError(e){
  if(Date.now()-warned<4000)return;warned=Date.now();
  if(e&&e.code==='invalid_argument') toast("This account can't make changes. Ask the owner for Contributor access.");
  else if(e&&e.code==='quota_exceeded') toast('Storage is full. Clear old sales in Settings.');
  else toast('Could not save. Check the connection.');
}
function saveLocal(){lsSet(LOCAL,{staff:S.staff,log:S.log,closes:S.closes,settings:S.settings,waiters:S.waiters,menu:S.menu,cats:S.cats||[],orders:S.orders,tickets:S.tickets,sales:S.sales})}
const saveCfg=()=>{S.waiters=S.staff.map(x=>x.name);put('pos/config',{settings:S.settings,staff:S.staff,waiters:S.waiters,menu:S.menu,cats:S.cats||[]})};
const catList=()=>{const order=(S.cats||[]).slice();S.menu.forEach(m=>{if(!order.includes(m.cat))order.push(m.cat)});return order};
const saveOrder=k=>put('orders/'+k,S.orders[k]);
const dropOrder=k=>{delete S.orders[k];put('orders/'+k,null)};
const saveTicket=t=>{const {id,...rest}=t;put('tickets/'+id,rest)};
const dropTicket=id=>{S.tickets=S.tickets.filter(t=>t.id!==id);put('tickets/'+id,null)};
const saveSale=s=>{const {id,...rest}=s;put('sales/'+id,rest)};

/* ---------- connect ---------- */
function setMode(m){mode=m;
  const el=document.getElementById('live'),tx=document.getElementById('liveTxt');
  el.className='live'+(m==='live'?' on':m==='local'||m==='slow'?' warn':'');
  tx.textContent={connecting:'Connecting',live:'Live',slow:'Reconnecting',local:'This device only'}[m];
  el.title={connecting:'Connecting to shared orders',live:'Orders sync to every screen with this page open',slow:'Shared orders are slow to load and may be out of date',local:'Not connected. Orders stay on this device only.'}[m];
}
function startLocal(){
  const L=lsGet(LOCAL)||clone(STARTER);
  S={staff:staffFrom(L.staff?L:{waiters:L.waiters||STARTER.waiters}),log:(L.log||[]).filter(e=>e.day===dayKey()),closes:L.closes||{},settings:L.settings||STARTER.settings,waiters:L.waiters||STARTER.waiters,menu:L.menu||clone(STARTER.menu),cats:L.cats||[],orders:L.orders||{},tickets:L.tickets||[],sales:(L.sales||[]).filter(s=>s.day===dayKey())};
  S.waiters=S.staff.map(x=>x.name);S.close=S.closes[dayKey()]||null;salesDay=dayKey();
  cfgLoaded=true;setMode('local');softRender();afterCfg();
}
let salesUnsub=null,salesDay=null;
function subscribeSales(day){
  if(salesUnsub)salesUnsub();
  salesDay=day||dayKey();followToday=salesDay===dayKey();S.sales=[];
  salesUnsub=db.collection('sales').where('day','==',salesDay).onSnapshot(q=>{
    S.sales=q.docs.map(d=>({id:d.id,...clone(d.data())}));softRender()},onErr);
  if(logUnsub)logUnsub();if(closeUnsub)closeUnsub();S.log=[];S.close=null;
  logUnsub=db.collection('log').where('day','==',salesDay).onSnapshot(q=>{S.log=q.docs.map(d=>({id:d.id,...clone(d.data())}));softRender()},onErr);
  closeUnsub=db.doc('closes/'+salesDay).onSnapshot(d=>{S.close=d.exists?clone(d.data()):null;softRender()},onErr);
}
let logUnsub=null,closeUnsub=null;
function onErr(e){ if(e&&(e.code==='revoked'||e.code==='unavailable')){setMode('slow')} }
async function connect(){
  let d=null;
  try{ d=window.claude&&window.claude.use?await window.claude.use('db'):null }catch(e){}
  try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){dl=null}
  if(!d) return startLocal();
  db=d;
  setupOwner();
  const timer=setTimeout(()=>{if(mode==='connecting')setMode('slow')},10000);
  const ok=snap=>{if(!snap.metadata.fromCache){clearTimeout(timer);if(mode!=='live')setMode('live')}};
  db.doc('pos/config').onSnapshot(s=>{
    if(s.exists){const c=clone(s.data());S.settings=c.settings||S.settings;S.staff=staffFrom(c);S.waiters=S.staff.map(x=>x.name);S.menu=c.menu||[];S.cats=c.cats||[]}
    cfgLoaded=true;ok(s);if(!s.exists&&!s.metadata.fromCache&&!S.menu.length){const c=clone(STARTER);S.settings=c.settings;S.staff=staffFrom(c);S.menu=c.menu;S.cats=c.cats||[];saveCfg()} /* brand-new database: seed the starter menu once */softRender();afterCfg()},onErr);
  db.collection('orders').onSnapshot(q=>{
    const o={};q.docs.forEach(x=>o[x.id]=clone(x.data()));
    for(const p in queue){if(p.startsWith('orders/')){const k=p.slice(7);if(queue[p]===null)delete o[k];else o[k]=clone(queue[p])}}
    S.orders=o;ok(q);softRender()},onErr);
  db.collection('tickets').onSnapshot(q=>{
    S.tickets=q.docs.map(x=>({id:x.id,...clone(x.data())}));watchTickets(S.tickets);ok(q);softRender()},onErr);
  subscribeSales();
}

/* ---------- kitchen clock ---------- */
const clock=ms=>{const p2=n=>String(n).padStart(2,'0'),t=Math.max(0,Math.floor(ms/1000)),m=Math.floor(t/60),h=Math.floor(m/60);return h?`${h}:${p2(m%60)}:${p2(t%60)}`:`${m}:${p2(t%60)}`};
setInterval(()=>{
  if(view!=='kitchen')return;
  document.querySelectorAll('[data-since]').forEach(el=>{
    const ms=Date.now()-(+el.dataset.since),txt=clock(ms);if(el.textContent!==txt)el.textContent=txt;
    const c=el.closest('.kt');if(!c)return;
    if(c.classList.contains('done')){const was=c.classList.contains('stale'),now=ms>=180000;if(now!==was){c.classList.toggle('stale',now);if(now)beep([660,520])}}
    else{c.classList.toggle('a1',ms>=600000&&ms<900000);c.classList.toggle('a2',ms>=900000);el.parentElement.classList.toggle('late',ms>=900000)}
  });
},1000);

/* ---------- sound ---------- */
document.addEventListener('pointerdown',()=>{try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}});
function beep(notes){if(!soundOn||!actx)return;try{const t0=actx.currentTime;notes.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain(),st=t0+i*.17;
  o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,st);g.gain.exponentialRampToValueAtTime(.28,st+.02);g.gain.exponentialRampToValueAtTime(.0001,st+.38);
  o.connect(g);g.connect(actx.destination);o.start(st);o.stop(st+.4)})}catch(e){}}
function watchTickets(list){
  const now={};list.forEach(t=>now[t.id]=t.status);
  if(seenT){
    const fresh=list.some(t=>t.status==='new'&&!(t.id in seenT));
    const ready=list.some(t=>t.status==='ready'&&seenT[t.id]!=='ready');
    if(fresh&&view==='kitchen')beep([880,1175,1568]);
    else if(ready&&view!=='kitchen'){beep([1047,784]);toast('Food ready: '+[...new Set(list.filter(t=>t.status==='ready'&&seenT[t.id]!=='ready').map(t=>lab(t.table)))].join(', '))}
  }
  seenT=now;
}

/* ---------- helpers ---------- */
function toast(msg){document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function waiterNow(){if(ownerMode)return 'Owner';return S.waiters.includes(myWaiter)?myWaiter:(S.waiters[0]||'Staff')}
function getO(){
  if(S.orders[cur])return S.orders[cur];
  if(!draft||draft.key!==cur)draft={key:cur,o:{waiter:waiterNow(),opened:Date.now(),lines:[],name:''}};
  return draft.o;
}
function commit(){const o=getO();S.orders[cur]=o;draft=null;
  if(!o.lines.length&&!S.tickets.some(t=>t.table==cur)){dropOrder(cur);draft={key:cur,o}}else saveOrder(cur)}
function state(k){
  const o=S.orders[k],tk=S.tickets.filter(t=>t.table==k);
  if(tk.some(t=>t.status==='ready'))return 'ready';
  if(tk.some(t=>t.status==='new'))return 'cook';
  if(o&&o.lines&&o.lines.length)return 'open';

const layer2=()=>document.getElementById('layer2');

function drawPin(bad){
  const p=pinSt;if(!p){layer2().innerHTML='';return}
  layer2().innerHTML=`<div class="scrim"><div class="modal" role="dialog" aria-label="${esc(p.title)}" style="width:min(340px,100%)">

function pinKey(k){
  const p=pinSt;if(!p)return;
  if(k==='x'){pinSt=null;layer2().innerHTML='';if(p.onCancel)p.onCancel();return}
  if(k==='b'){p.entered=p.entered.slice(0,-1);return drawPin()}
  if(k==='o'){const cb=p.onOk;pinSt=null;layer2().innerHTML='';return openOwnerLogin(()=>cb({name:'Owner'}))}
  if(p.entered.length>=4)return;
  p.entered+=k;drawPin();
  if(p.entered.length===4){
    const pin=p.entered;
    if(p.set){pinSt=null;layer2().innerHTML='';return p.onOk(pin)}
    const h=pinHash(pin),who=(p.pool||S.staff).find(x=>x.pin===h);
    if(who){pinSt=null;layer2().innerHTML='';p.onOk(who)}
    else{p.entered='';setTimeout(()=>drawPin(true),120)}
  }
}

async function sha(t){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return pinHash(t)}}
async function setupOwner(){
  try{const u=window.claude&&window.claude.use?await window.claude.use('user'):null;if(!u)return;
    isOwnerAcct=false;return;
    const id=await u.id();if(!id)return;ownerPath='data/users/'+id+'/owner';
    db.doc(ownerPath).onSnapshot(d=>{ownerSecret=d.exists?clone(d.data()):null;if(locked)drawLock();softRender()},()=>{});
    if(locked)drawLock();softRender();
  }catch(e){}
}
function openOwnerLogin(onOk,forceCreate){
  const create=forceCreate||!ownerSecret;ownerCb=onOk;
  layer2().innerHTML=`<div class="scrim"><div class="modal" role="dialog" aria-label="Owner login" style="width:min(400px,100%)">
    <h3>${create?(forceCreate&&ownerSecret?'New owner password':'Create owner password'):'Owner login'}</h3>
    <div class="sub">${create?'At least 6 characters. It works only on your own Claude account, so staff can\'t use it even on a shared tablet.':'Enter your owner password.'}</div>
    <input id="owPw" type="password" autocomplete="${create?'new-password':'current-password'}" placeholder="Owner password" aria-label="Owner password">
    ${create?'<input id="owPw2" type="password" autocomplete="new-password" placeholder="Type it again" aria-label="Type it again">':''}
    <div class="pinmsg bad" id="owMsg"></div>
    <div class="acts" style="padding:0"><button class="btn sec" data-owcancel>Cancel</button><button class="btn pri" data-owok="${create?'create':'check'}">${create?'Save password':'Sign in'}</button></div></div></div>`;
  setTimeout(()=>{const i=document.getElementById('owPw');if(i)i.focus()},50);
}
async function owSubmit(kind){
  const msg=t=>{const m=document.getElementById('owMsg');if(m)m.textContent=t};
  const pw=(document.getElementById('owPw')||{}).value||'';
  if(kind==='create'){const pw2=(document.getElementById('owPw2')||{}).value||'';
    if(pw.length<6)return msg('Use at least 6 characters');if(pw!==pw2)return msg('The two passwords are different');
    const salt=uid(),h=await sha(salt+pw);ownerSecret={salt,h};
    if(mode==='live'&&ownerPath){try{await db.doc(ownerPath).set(ownerSecret)}catch(e){return msg('Could not save. Check the connection.')}}
    toast('Owner password saved');
  }else{
    if(Date.now()<owBlockUntil)return msg('Too many tries. Wait 30 seconds.');
    if(!ownerSecret||await sha(ownerSecret.salt+pw)!==ownerSecret.h){if(++owFails>=5){owFails=0;owBlockUntil=Date.now()+30000}return msg('Wrong password')}
    owFails=0;
  }
  layer2().innerHTML='';const cb=ownerCb;ownerCb=null;if(cb)cb();
}

/* ---------- receipt ---------- */
function rLines(s){
  const st=S.settings,L=[],dt=new Date(s.time);
  const when=dt.toLocaleDateString('en-CA',{year:'numeric',month:'short',day:'numeric'})+' '+dt.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  if(s.refunded)L.push({c:'*** REFUNDED ***',big:1});
  L.push({c:st.name,big:1});
  if(st.address)L.push({c:st.address,m:1});
  if(st.phone)L.push({c:st.phone,m:1});
  L.push({hr:1});
  L.push({l:s.bill?'BILL':'Receipt #'+(s.no||'—'),r:when});
  L.push({l:lab(s.table)+(s.customer?' · '+s.customer:''),r:'Server: '+s.waiter});
  L.push({hr:1});
  (s.items||[]).forEach(i=>L.push({l:i.qty+' x '+i.name+(i.side?' + '+i.side:''),r:fmt(i.total)}));
  L.push({hr:1});
  L.push({l:'Subtotal',r:fmt(s.sub)});
  if(s.disc)L.push({l:'Discount'+(s.discPct?' '+s.discPct+'%':''),r:'-'+fmt(s.disc)});
  L.push({l:'GST'+(s.taxPct!=null?' '+s.taxPct+'%':''),r:fmt(s.tax)});
  if(s.tip)L.push({l:'Tip'+(s.tipPct?' '+s.tipPct+'%':''),r:fmt(s.tip)});
  if(s.rounding)L.push({l:'Cash rounding',r:(s.rounding>0?'+':'-')+fmt(Math.abs(s.rounding))});
  L.push({l:'TOTAL',r:fmt(s.paid),b:1});
  L.push({hr:1});
  if(s.bill){const base=s.sub-(s.disc||0);
    [5,10].forEach(p=>L.push({l:'With '+p+'% tip',r:fmt(s.paid+base*p/100)}));
    L.push({hr:1});L.push({c:'This is your bill, not a receipt'});L.push({c:st.footer||'Thank you!'});return L}
  L.push({l:'Paid by',r:s.method});
  if(s.cash!=null){L.push({l:'Cash received',r:fmt(s.cash)});L.push({l:'Change',r:fmt(s.change)})}
  if(s.split>1){L.push({l:'Split '+s.split+' ways',r:fmt(s.paid/s.split)+' each'})}
  if(st.gst){L.push({hr:1});L.push({c:'GST # '+st.gst,m:1})}
  L.push({c:st.footer||'Thank you!'});
  return L;
}
function receiptHTML(s){return `<div class="paper" id="paper">${rLines(s).map(x=>x.hr?'<hr>':x.c!=null?`<div class="c ${x.big?'big':''} ${x.m?'m':''}">${esc(x.c)}</div>`:`<div class="r ${x.b?'b':''}"><span>${esc(x.l)}</span><span>${esc(x.r)}</span></div>`).join('')}</div>`}
function receiptText(s){const W=34;return rLines(s).map(x=>{
  if(x.hr)return '-'.repeat(W);
  if(x.c!=null){const p=Math.max(0,Math.floor((W-x.c.length)/2));return ' '.repeat(p)+x.c}
  const gap=Math.max(1,W-x.l.length-x.r.length);return x.l+' '.repeat(gap)+x.r}).join('\n')}

function receiptPDF(s){
  const J=window.jspdf&&window.jspdf.jsPDF;if(!J)return null;
  const L=rLines(s),W=80,M=4,inner=W-M*2;
  const lay=d=>{let y=M+2;const out=[];
    for(const x of L){
      if(x.hr){out.push({hr:1,y:y+1.5});y+=3;continue}
      if(x.c!=null){const fs=x.big?14:x.m?8:9;d.setFont('helvetica',x.big?'bold':'normal');d.setFontSize(fs);
        const ls=d.splitTextToSize(x.c,inner);ls.forEach(t=>{y+=fs*0.42;out.push({c:t,fs,b:x.big,y})});y+=1.2;continue}
      const fs=x.b?11:9;d.setFont('helvetica',x.b?'bold':'normal');d.setFontSize(fs);
      const rw=d.getTextWidth(x.r)+3,ls=d.splitTextToSize(x.l,inner-rw);
      ls.forEach((t,i)=>{y+=fs*0.42;out.push({l:t,r:i===0?x.r:'',fs,b:x.b,y})});y+=1.2}
    return {out,h:y+M+6}};
  const probe=new J({unit:'mm',format:[W,200]}),{h}=lay(probe);
  const d=new J({unit:'mm',format:[W,Math.max(h,W+1)]}),{out}=lay(d);
  d.setTextColor(0);d.setDrawColor(150);d.setLineDashPattern([1,1],0);
  for(const o of out){
    if(o.hr){d.line(M,o.y,W-M,o.y);continue}
    d.setFont('helvetica',o.b?'bold':'normal');d.setFontSize(o.fs);
    if(o.c!=null)d.text(o.c,W/2,o.y,{align:'center'});
    else{d.text(o.l,M,o.y);if(o.r)d.text(o.r,W-M,o.y,{align:'right'})}
  }
  d.setProperties({title:(s.bill?'Bill ':'Receipt ')+(s.no||'')});
  try{d.autoPrint({variant:'javascript'})}catch(e){}
  return d.output('blob');
}
async function printReceipt(s){
  const blob=receiptPDF(s);
  if(!blob){toast('Printing is still loading. Try again in a moment.');return}
  const nm=s.bill?`bill-${String(s.table).replace(/\W/g,'')}-${Date.now().toString().slice(-5)}.pdf`:`receipt-${s.no||s.id}.pdf`;
  try{await dl.save({filename:nm,data:blob});toast((s.bill?'Bill':'Receipt')+' saved. Open it and the print window opens.')}

async function saveReceipt(s){
  const L=rLines(s),W=576,pad=36,lh=34,h=pad*2+L.reduce((a,x)=>a+(x.hr?20:x.big?50:lh),0);
  const c=document.createElement('canvas');c.width=W;c.height=h;const g=c.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,W,h);g.fillStyle='#111';g.textBaseline='middle';
  let y=pad;
  for(const x of L){
    if(x.hr){g.strokeStyle='#999';g.setLineDash([6,5]);g.beginPath();g.moveTo(pad,y+10);g.lineTo(W-pad,y+10);g.stroke();y+=20;continue}
    if(x.c!=null){g.font=x.big?'800 34px "Bricolage Grotesque", sans-serif':(x.m?'500 20px Figtree, sans-serif':'600 22px Figtree, sans-serif');
      g.fillStyle=x.m?'#555':'#111';g.textAlign='center';const hh=x.big?50:lh;g.fillText(x.c,W/2,y+hh/2,W-pad*2);y+=hh;g.fillStyle='#111';continue}
    g.font=(x.b?'800 28px':'500 22px')+' Figtree, sans-serif';
    g.textAlign='left';g.fillText(x.l,pad,y+lh/2,W*0.62);g.textAlign='right';g.fillText(x.r,W-pad,y+lh/2,W*0.4);y+=lh;
  }
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));
  try{await dl.save({filename:`receipt-${s.no||s.id}.png`,data:blob});toast('Receipt saved')}
  catch(e){if(e&&e.code==='declined')return;if(e&&e.code==='rate_limited')return toast('One moment, then try again');toast('Saving is not available here. Use Copy receipt.')}
}

function exportCSV(){
  const cell=v=>{const x=String(v??'');return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x};
  const head=['Receipt','Date','Time','Table','Waiter','Payment','Subtotal','Discount','GST','Tip','Rounding','Total','Status','Items'];
  const rows=[...S.sales].sort((a,b)=>a.time-b.time).map(s=>[s.no||'',s.day,new Date(s.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),lab(s.table),s.waiter,s.method,
    (s.sub||0).toFixed(2),(s.disc||0).toFixed(2),(s.tax||0).toFixed(2),(s.tip||0).toFixed(2),(s.rounding||0).toFixed(2),(s.paid||0).toFixed(2),s.refunded?'Refunded':'Paid',(s.items||[]).map(i=>i.qty+'x '+i.name+(i.side?' + '+i.side:'')).join('; ')]);
  const csv=[head,...rows].map(r=>r.map(cell).join(',')).join('\n');
  const name=`mr-chef-sales-${salesDay||dayKey()}.csv`;
  if(dl){dl.save({filename:name,data:csv}).then(()=>toast('Sales file saved'),e=>{if(!e||e.code!=='declined')copyText(csv,'Sales copied — paste into a spreadsheet')})}
  else copyText(csv,'Sales copied — paste into a spreadsheet');
}
function copyText(txt,msg){try{navigator.clipboard.writeText(txt).then(()=>toast(msg),()=>toast('Copy is not available here'))}catch(e){toast('Copy is not available here')}}

document.addEventListener('change',e=>{
  const t=e.target,d=t.dataset;if(!d)return;
  if(d.role){const x=S.staff.find(y=>y.id===d.role);if(x){
    if(!ownerMode&&x.role==='admin'&&t.value!=='admin'&&x.pin&&S.staff.filter(y=>y.role==='admin'&&y.pin).length===1){toast('Keep at least one admin. Make someone else Admin first.');return render()}
    x.role=t.value;saveCfg();toast(x.name+' is now '+(ROLE[t.value]||t.value))}return render()}
  if(t.id==='autoLockSel'){S.settings.autoLock=+t.value;saveCfg();toast(+t.value?'Screen locks after '+t.value+' minutes':'Auto-lock off');return}
  if(t.id==='rDate'&&t.value){subscribeSales(t.value);dirty=false;return render()}
  if(d.iname){const m=S.menu.find(x=>x.id===d.iname),v=t.value.trim();if(m&&v&&v!==m.name){m.name=v;saveCfg();toast('Name saved')}else if(m)t.value=m.name}
  else if(d.iprice){const m=S.menu.find(x=>x.id===d.iprice),v=parseFloat(t.value);if(m&&!isNaN(v)&&v>=0&&v!==m.price){m.price=Math.round(v*100)/100;saveCfg();toast(`${m.name} now ${fmt(m.price)}`)}else if(m)t.value=m.price}
  else if(d.rencat!==undefined){const old=d.rencat,v=t.value.trim();if(!v||v===old){t.value=old;return}
    if(catList().includes(v)){t.value=old;return toast('That column already exists')}
    S.cats=catList().map(c=>c===old?v:c);S.menu.forEach(m=>{if(m.cat===old)m.cat=v});if(curCat===old)curCat=v;saveCfg();toast('Column renamed');dirty=false;render()}
  else if(d.imove){const m=S.menu.find(x=>x.id===d.imove);if(m&&t.value!==m.cat){m.cat=t.value;saveCfg();toast(`${m.name} moved to ${m.cat}`);dirty=false;render()}}
});

let lang=lsGet('mrchef-lang')||'en';
const LI={so:1,ar:2},MAP={};TR.forEach(r=>{MAP[r[0]]=r});
function trOne(t){
  if(lang==='en'||!t)return t;
  const i=LI[lang];if(MAP[t])return MAP[t][i];
  for(const [re,...o] of PAT){if(re.test(t)){const out=t.replace(re,o[i-1]);return out.replace(/Table (\S+)/,(m,a)=>trOne(m))}}
  return null;
}
function trText(t){
  if(lang==='en')return t;
  const m=t.match(/^(\s*)([\s\S]*?)(\s*)$/),core=m[2];if(!core)return t;
  let r=core.includes('·')?null:trOne(core);
  if(r==null&&core.includes('·')){const parts=core.split('·').map(x=>x.trim());const tp=parts.map(x=>x===''?'':(trOne(x)??x));if(tp.some((x,i)=>x!==parts[i]))r=tp.join(' · ').trim()}
  if(r==null&&/^·\s/.test(core)){const x=trOne(core.slice(2));if(x!=null)r='· '+x}
  return r==null?t:m[1]+r+m[3];
}
const SKIP='.paper,.rcpt,script,style,textarea';
function trNode(n){
  if(n.nodeType===3){const p=n.parentElement;if(!p||p.closest(SKIP))return;
    if(n.__en===undefined)n.__en=n.data;const v=trText(n.__en);if(n.data!==v)n.data=v;return}
  if(n.nodeType!==1||n.closest(SKIP))return;
  const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT);let x;const list=[];while((x=w.nextNode()))list.push(x);list.forEach(trNode);
  const els=n.matches('[placeholder],[aria-label]')?[n]:[];n.querySelectorAll('[placeholder],[aria-label]').forEach(e=>els.push(e));
  els.forEach(e=>{if(e.closest(SKIP))return;['placeholder','aria-label'].forEach(a=>{const k='__'+a;if(!e.hasAttribute(a))return;if(e[k]===undefined)e[k]=e.getAttribute(a);const v=trText(e[k]);if(e.getAttribute(a)!==v)e.setAttribute(a,v)})});
}
function applyLang(){
  document.documentElement.lang=lang==='so'?'so':lang==='ar'?'ar':'en';
  document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  const sel=document.getElementById('langSel');if(sel)sel.value=lang;
  trNode(document.body);
}
new MutationObserver(ms=>{if(lang==='en')return;ms.forEach(m=>m.addedNodes.forEach(trNode))}).observe(document.body,{childList:true,subtree:true});
document.getElementById('langSel').addEventListener('change',e=>{lang=e.target.value;lsSet('mrchef-lang',lang);applyLang()});
applyLang();

render();
